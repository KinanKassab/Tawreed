<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>رمز تفعيل حسابك | توريد</title>
  </head>
  <body style="margin:0;padding:0;background:#FBF6EC;font-family:Tahoma,Arial,sans-serif;color:#14201D;direction:rtl">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent">رمز تفعيل حسابك في توريد جاهز.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#FBF6EC">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;background:#FFFFFF;border:1px solid #DDE2E0;border-radius:22px;overflow:hidden">
            <tr>
              <td align="center" style="background:#0E5245;padding:28px 32px 24px">
                <img src="{{ .SiteURL }}/app-icon-192.png" width="76" height="76" alt="توريد" style="display:block;width:76px;height:76px;border:0;border-radius:20px;margin:0 auto 14px">
                <div style="font-size:25px;line-height:36px;font-weight:700;color:#FFFFFF">توريد</div>
                <div style="font-size:14px;line-height:24px;color:#D3E9E2">احتياجك، واصل لعندك.</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;text-align:right">
                <h1 style="margin:0 0 14px;font-size:25px;line-height:38px;color:#14201D">فعّل حسابك</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:28px;color:#5B6662">استخدم رمز التفعيل التالي لإكمال تجهيز حسابك في توريد:</p>
                <div style="background:#ECF5F2;border:1px solid #A6D2C5;border-radius:18px;padding:20px 16px;text-align:center">
                  <div style="font-family:Manrope,Arial,sans-serif;font-size:34px;line-height:44px;font-weight:800;letter-spacing:8px;color:#0E5245;direction:ltr">{{ .Token }}</div>
                </div>
                <p style="margin:24px 0 0;font-size:14px;line-height:24px;color:#5B6662">تنتهي صلاحية الرمز خلال ساعة. إذا لم تطلب إنشاء الحساب، تجاهل هذه الرسالة بأمان.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="border-top:1px solid #DDE2E0;padding:18px 24px;background:#F7F8F7;font-size:12px;line-height:20px;color:#5B6662">توريد | منصة المستلزمات والأدوات الطبية</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
